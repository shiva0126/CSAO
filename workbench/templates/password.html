<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} | CSAO Analyst Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/workbench.css') }}">
</head>
<body class="workbench-shell">
  <main class="container py-5" style="max-width: 520px;">
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="text-uppercase small text-secondary">CSAO</div>
          <h3 class="mb-1">Change Password</h3>
          <div class="text-secondary">{{ current_user.display_name if current_user else '' }}</div>
        </div>
      </div>
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      {% if message %}
      <div class="alert alert-success">{{ message }}</div>
      {% endif %}
      <form method="post" action="/api/password">
        <div class="mb-3">
          <label class="form-label">Current Password</label>
          <input class="form-control" type="password" name="current_password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input class="form-control" type="password" name="new_password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input class="form-control" type="password" name="confirm_password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Update Password</button>
      </form>
    </div>
  </main>
</body>
</html>
