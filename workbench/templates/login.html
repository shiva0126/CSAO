<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} | CSAO Analyst Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/workbench.css') }}">
</head>
<body class="workbench-shell">
  <main class="container py-5" style="max-width: 480px;">
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="text-uppercase small text-secondary">CSAO</div>
          <h3 class="mb-1">Login</h3>
          <div class="text-secondary">Secure local analyst access</div>
        </div>
      </div>
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      {% if message %}
      <div class="alert alert-success">{{ message }}</div>
      {% endif %}
      <form method="post" action="/api/login">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" name="username" autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      {% if development_mode %}
      <hr>
      <div class="small text-secondary mb-2">Development only</div>
      <form method="post" action="/api/dev/reset-password">
        <button class="btn btn-outline-secondary w-100" type="submit">Reset Development Password</button>
      </form>
      <div class="form-help mt-2">Resets {{ development_user_username }} to the local development password.</div>
      {% endif %}
    </div>
  </main>
</body>
</html>
