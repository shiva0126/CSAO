<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} | CSAO Analyst Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/workbench.css') }}">
</head>
<body class="workbench-shell">
  <main class="container py-5" style="max-width: 560px;">
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="text-uppercase small text-secondary">CSAO</div>
          <h3 class="mb-1">Initial Administrator Setup</h3>
          <div class="text-secondary">Create the first local administrator account.</div>
        </div>
      </div>
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form method="post" action="/api/setup">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Username</label>
            <input class="form-control" type="text" name="username" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Display Name</label>
            <input class="form-control" type="text" name="display_name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm Password</label>
            <input class="form-control" type="password" name="confirm_password" required>
          </div>
        </div>
        <button class="btn btn-primary w-100 mt-3" type="submit">Create Administrator</button>
      </form>
    </div>
  </main>
</body>
</html>
