###############################################################################
# Cloud Security Assessment Orchestrator (CSAO)
# Predefined MITRE ATT&CK Mapping Table
#
# Keyed by "<tool>:<check_id>". check_id is the stable identifier the
# Normalization Engine extracts per tool:
#   - steampipe      -> SQL file path relative to queries/, no extension
#                        e.g. "aws/iam/wildcard_permissions"
#   - prowler         -> Prowler CheckID (e.g. "s3_bucket_level_public_access_block")
#   - cloudsplaining  -> Cloudsplaining finding_type
#                        (e.g. "PrivilegeEscalation", "ResourceExposure")
#   - access_analyzer -> "external_access" (single synthetic check_id, since
#                         Access Analyzer findings are inherently "resource is
#                         externally reachable")
#   - config_aggregator -> Config rule name
#
# One check_id may map to MULTIPLE techniques - value is always a list.
# This table replaces keyword-matching against filenames/free text; the
# MITRE Mapping Engine only ever does a lookup, never a substring scan.
#
# Extend this file as new checklist items / tools are added rather than
# adding heuristics in code.
###############################################################################

