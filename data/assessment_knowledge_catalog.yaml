  primary_asset_at_risk: EC2 / GCE Public Instances / IMDSv1
  priority_tier: P1 — Immediate
  priority_score: '100'
  severity: Critical
  exploitability: Direct
  attack_phase: Entry
  blast_radius: Critical
  chain_potential: Critical
  evidence_type: Configuration Scan / Port Scan Output
  evidence_format: Structured list (Check No. | Resource ID | Exposed Port/Endpoint
    | Source CIDR | Severity rating)
  pass_criteria: Zero resources expose management ports or sensitive services to 0.0.0.0/0;
    all access restricted to approved CIDRs
  fail_indicator: Any resource with 0.0.0.0/0 inbound on non-HTTP ports; admin panels
    publicly accessible
  collection_method: AWS CLI / GCP CLI / Nmap scan / Console screenshot
